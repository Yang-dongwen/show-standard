server:
  port: 8080

spring:
  application:
    name: ddmo
  # 日常开发默认 cloud → application-cloud.yml（你的 MySQL）
  # 验证本地买断包：--spring.profiles.active=desktop
  profiles:
    active: cloud
  main:
    lazy-initialization: true
  jmx:
    enabled: false
  # 建表由 Flyway 管理（具体 locations 在 cloud / desktop profile）
  sql:
    init:
      mode: never
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB

logging:
  level:
    root: INFO
    com.ddmo: DEBUG

app:
  # ========== 客户交付两套 SKU ==========
  # desktop = 本地买断（SQLite）· 见 application-desktop.yml / 安装向导 local
  # cloud   = SaaS（MySQL）· 见 application-cloud.yml · 日常开发默认
  # 默认 deployment 会被 active profile 覆盖
  deployment: cloud
  security:
    strict-cloud: false
  jwt:
    secret: bootstrap-placeholder-change-me-32bytes-min!!
    expire-minutes: 720
    tenant-aes-key: bootstrap-aes-placeholder-key
  auth:
    allow-plaintext-password: false
  register:
    mode: first-only
    invite-code: DEMO-CEND
  saas:
    bootstrap-enabled: true
    bootstrap-username: platform
    bootstrap-password: platform123
    invite-code: WELCOME
  wx:
    miniapp:
      enabled: false
      app-id: demo-app-id
      app-secret: demo-app-secret
      mock: true
  backup:
    dir: ${user.home}/.show/backups
