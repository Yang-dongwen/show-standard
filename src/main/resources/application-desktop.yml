# ========== SKU：本地买断版（SQLite）==========
# 启用：--spring.profiles.active=desktop
# 或安装向导选择「本地买断」后写入 install.properties
# 日常开发默认不用本文件，默认走 cloud + MySQL

spring:
  datasource:
    url: jdbc:sqlite:${user.home}/.show/show.db
    username: show
    password: show
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1
      minimum-idle: 1
      connection-timeout: 30000
      max-lifetime: 0
      pool-name: show-sqlite
  flyway:
    enabled: true
    locations: classpath:db/migration/sqlite
    baseline-on-migrate: true
    baseline-version: 1
    validate-on-migrate: true

app:
  deployment: desktop
  wx:
    miniapp:
      enabled: false
