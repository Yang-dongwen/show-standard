# ========== SKU：SaaS / 日常开发默认 ==========
# 默认已 spring.profiles.active=cloud（见 application.yml）
# 数据源：本机 MySQL（改账号密码只改这里即可）
# 包含：SaaS 运营台、邀请开店、商家小程序

spring:
  datasource:
    # 改成你的本机 MySQL
    # createDatabaseIfNotExist：本地首次启动自动建库 show（避免 Unknown database）
    url: jdbc:mysql://127.0.0.1:3306/show?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      pool-name: show-mysql
  sql:
    init:
      mode: never
  flyway:
    enabled: true
    locations: classpath:db/migration/mysql
    baseline-on-migrate: true
    baseline-version: 1
    validate-on-migrate: true

app:
  deployment: cloud
  security:
    # 公网生产务必 true（并关闭 mock、配置真实微信密钥）
    strict-cloud: false
  register:
    # 云上开店走 SaaS 邀请码
    mode: first-only
  saas:
    bootstrap-enabled: true
    bootstrap-username: platform
    bootstrap-password: platform123
  wx:
    miniapp:
      enabled: true
      app-id: demo-app-id
      app-secret: demo-app-secret
      # 联调 true；上线 false + 真实 app-id/secret
      mock: true
