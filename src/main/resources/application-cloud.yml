# ========== SKU：SaaS 云版 ==========
# 启用：spring.profiles.active=cloud
# 强制：云端 MySQL（开发阶段可用本机/容器 MySQL 代替远端云库）
# 包含：SaaS 运营台、邀请开店、商家小程序；非买断单机包

spring:
  datasource:
    # 本地 MySQL 默认：库 show / 用户 show / 密码 show
    # 请先建库：CREATE DATABASE show DEFAULT CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
    url: jdbc:mysql://127.0.0.1:3306/show?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: admin
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      pool-name: show-mysql
  sql:
    init:
      mode: never
  flyway:
    enabled: true
    locations: classpath:db/migration/mysql
    baseline-on-migrate: true
    baseline-version: 1

app:
  deployment: cloud   # SaaS 订阅 · 云 MySQL · 非本地买断
  security:
    # 公网生产务必 true（并关闭 mock、配置真实微信密钥）
    strict-cloud: false
  register:
    # 云上开店走 SaaS 邀请码
    mode: first-only
  saas:
    bootstrap-enabled: true
    bootstrap-username: platform
    bootstrap-password: platform123
  wx:
    miniapp:
      enabled: true
      app-id: demo-app-id
      app-secret: demo-app-secret
      # 联调 true；上线 false + 真实 app-id/secret
      mock: true
