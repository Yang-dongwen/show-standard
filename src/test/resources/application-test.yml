# 集成测试：独立 SQLite 文件（由测试 DynamicProperty 覆盖路径）
spring:
  main:
    lazy-initialization: false
  datasource:
    username: show
    password: show
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1
  sql:
    init:
      mode: never
  flyway:
    enabled: true
    locations: classpath:db/migration/sqlite
    baseline-on-migrate: true
    baseline-version: 1

app:
  deployment: desktop
  security:
    strict-cloud: false
  register:
    mode: open
  saas:
    bootstrap-enabled: false
  wx:
    miniapp:
      enabled: false
      mock: true
  backup:
    dir: ${java.io.tmpdir}/show-test-backups

logging:
  level:
    root: WARN
    com.ddmo: INFO
