# HTTP reverse proxy → Spring Boot app:8080
# TLS terminates at cloud LB later; this config is HTTP-only.
# Static assets (C-end / and SaaS /saas/) are served by the fat jar.

upstream show_app {
    server app:8080;
    keepalive 16;
}

server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 50m;

    # Health-friendly: any response from app counts; nginx itself answers when up
    location / {
        proxy_pass http://show_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }
}
